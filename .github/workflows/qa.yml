name: RouteDex QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Data QA
        run: pnpm agent:qa:data
      - name: External source QA
        run: pnpm agent:qa:source
      - name: Interaction QA
        run: pnpm agent:qa:interaction
      - name: Visual QA
        run: pnpm agent:qa:visual
      - name: Unit tests and production build
        run: pnpm agent:check
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routedex-qa-artifacts
          path: artifacts/qa
          if-no-files-found: warn
